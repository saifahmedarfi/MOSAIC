name: lce
channels: [conda-forge, pytorch, nvidia]
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24,<3
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - joblib>=1.3
  - tqdm
  - rdkit>=2023.09
  - pytorch>=2.0
  - pytorch-cuda=11.8      # match your cluster's driver
  - pip:
      - PyTDC>=0.4.1
